      * { margin: 0; padding: 0; box-sizing: border-box; }

      }

      .ring {
        position: absolute;
        top: 0; left: 0;
        width: 88px; height: 88px;
        border-radius: 50%;
        border: 2.5px solid transparent;
        border-top-color: #6C4DFF;
        border-right-color: #6C4DFF44;

      }

      .ring2 {
        width: 74px; height: 74px;
        top: 7px; left: 7px;
        border-top-color: transparent;
        border-right-color: transparent;

        animation: spin 1.5s linear infinite reverse;

      .text-block { text-align: center; }

        color: #1a1a2e;

      }

      .tagline {
        font-size: 12px;
        color: #6C4DFF;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        animation: pulse 2s ease infinite;
      }

      .dots {
        display: flex;
        gap: 7px;
      }

      .dot {
        width: 7px; height: 7px;
        border-radius: 50%;
        background: #6C4DFF;
        animation: pulse 1.4s ease infinite;
      }
      .dot:nth-child(2) { animation-delay: 0.2s; background: #9D7FFF; }
      .dot:nth-child(3) { animation-delay: 0.4s; background: #C4B0FF; }

      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.35; } }
      @keyframes fadein { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

      /* Hidden from users, visible to Google */
      .seo {
        position: absolute;
        left: -9999px;
        top: auto;
